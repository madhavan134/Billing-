<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant Billing</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg:#FAF9F6; --paper:#FFFFFF; --ink:#211D1B; --sub:#8A8178;
    --accent:#B8272C; --accent-dark:#8C1D1F; --accent-soft:#F6E1E1; --on-accent:#FFFFFF;
    --border:#EDEAE4; --border-strong:#E5E1D9;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Work Sans',sans-serif;background:#EFEAE0;color:var(--ink);}
  #app{max-width:900px;margin:0 auto;min-height:100vh;background:var(--bg);}
  h1,h2,h3{font-family:'Fraunces',serif;margin:0;}
  input,button{font-family:'Work Sans',sans-serif;}
  .input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border-strong);font-size:14px;outline:none;background:#fff;color:var(--ink);}
  .input:focus{border-color:var(--accent);}
  .label{display:block;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px;}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer;}
  .btn-primary{background:var(--accent);color:var(--on-accent);}
  .btn-secondary{background:transparent;color:var(--ink);border:1px solid var(--border-strong);font-weight:500;}
  .btn-icon{border:none;background:transparent;cursor:pointer;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:var(--sub);border-radius:6px;}
  .btn-icon:hover{background:rgba(0,0,0,.05);}
  .mono{font-family:'JetBrains Mono',monospace;}
  .row{display:flex;align-items:center;}
  .between{justify-content:space-between;}
  .center{justify-content:center;}
  .error{color:#B8272C;font-size:13px;margin-top:10px;}
  .success{color:var(--accent-dark);font-size:13px;}

  /* Wizard */
  .wizard{max-width:560px;margin:0 auto;padding:28px 24px;}
  .wizard-progress{display:flex;gap:6px;margin-bottom:22px;}
  .wizard-progress div{flex:1;height:4px;border-radius:2px;background:var(--border-strong);}
  .wizard-progress div.active{background:var(--accent);}
  .wizard-step-label{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#9A9186;font-weight:600;margin:0 0 4px;}
  .wizard-title{font-size:26px;margin:8px 0 6px;font-weight:600;}
  .wizard-sub{color:#8A8178;font-size:14px;margin:0 0 18px;}
  .theme-grid,.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .theme-card{text-align:left;padding:14px;border-radius:10px;border:1px solid var(--border-strong);background:#fff;cursor:pointer;}
  .theme-card.selected{border:2px solid var(--accent);}
  .theme-swatch{width:26px;height:26px;border-radius:7px;margin-bottom:8px;}
  .pay-card{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;cursor:pointer;border:1px solid var(--border-strong);background:#fff;font-size:14px;font-weight:500;}
  .pay-card.selected{border:2px solid var(--accent);background:var(--accent-soft);}
  .item-add-grid{display:grid;grid-template-columns:2fr 1.3fr 1fr auto;gap:8px;margin-bottom:10px;}
  .item-list{max-height:180px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;}
  .item-list .row{padding:8px 12px;border-bottom:1px solid #F2EFE9;}
  .item-list .row:last-child{border-bottom:none;}
  .wizard-nav{display:flex;justify-content:space-between;margin-top:26px;}

  /* Billing screen */
  .app-header{background:var(--accent);color:var(--on-accent);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;}
  .app-header h1{font-size:22px;font-weight:600;}
  .app-header p{font-size:12px;opacity:.85;margin:2px 0 0;}
  .header-lock{background:rgba(255,255,255,.18);border:none;color:var(--on-accent);width:36px;height:36px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .pos-layout{display:flex;flex-direction:column;}
  @media(min-width:760px){.pos-layout{flex-direction:row;}.menu-col{flex:1.4;}.cart-col{width:340px !important;border-top:none !important;border-left:1px solid var(--border);}}
  .menu-col{padding:16px;flex:1;}
  .search-wrap{position:relative;margin-bottom:12px;}
  .search-wrap svg{position:absolute;left:10px;top:11px;color:#9A9186;}
  .search-wrap input{padding-left:32px;}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;}
  .chip{white-space:nowrap;padding:6px 13px;border-radius:999px;font-size:13px;cursor:pointer;border:1px solid var(--border-strong);background:transparent;color:var(--sub);font-weight:500;}
  .chip.active{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent-dark);}
  .menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
  .menu-card{text-align:left;padding:12px;border-radius:10px;cursor:pointer;background:var(--paper);border:1px solid var(--border);color:var(--ink);}
  .menu-card .cat{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
  .menu-card .nm{font-size:14px;font-weight:500;margin-bottom:8px;min-height:34px;}
  .menu-card .pr-row{display:flex;align-items:center;justify-content:space-between;}
  .menu-card .price{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:500;}
  .menu-card .plus{width:24px;height:24px;border-radius:6px;background:var(--accent-soft);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;}
  .empty-msg{color:var(--sub);font-size:14px;}

  .cart-col{width:100%;padding:16px;border-top:1px solid var(--border);background:#F4F1EA;}
  .receipt-box{background:var(--paper);border-radius:10px;border:1px dashed var(--border-strong);padding:16px 16px 12px;font-family:'JetBrains Mono',monospace;}
  .receipt-box .title{font-family:'Fraunces',serif;font-size:15px;font-weight:600;margin-bottom:10px;text-align:center;letter-spacing:.5px;}
  .cart-line{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px solid #F0ECE3;}
  .cart-line .nm{flex:1;font-family:'Work Sans',sans-serif;}
  .cart-line .qty{min-width:16px;text-align:center;}
  .cart-line .amt{min-width:64px;text-align:right;}
  .cart-totals{margin-top:10px;font-size:13px;}
  .cart-totals .grand{display:flex;justify-content:space-between;font-weight:700;font-size:16px;margin-top:6px;padding-top:6px;border-top:1px solid var(--border-strong);}
  .pay-row{display:flex;gap:8px;margin:12px 0 10px;flex-wrap:wrap;}
  .pay-chip{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;border:1px solid var(--border-strong);background:var(--paper);color:var(--ink);}
  .pay-chip.selected{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent-dark);}
  .complete-btn{width:100%;justify-content:center;}
  .complete-btn:disabled{opacity:.5;cursor:not-allowed;}

  /* Modals */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:#fff;border-radius:10px;width:320px;padding:22px;}
  .receipt-modal{width:340px;max-height:85vh;overflow-y:auto;padding:22px 20px;font-family:'JetBrains Mono',monospace;}
  .receipt-modal .rhead{text-align:center;margin-bottom:14px;}
  .receipt-modal .rhead .nm{font-family:'Fraunces',serif;font-size:18px;font-weight:600;}
  .receipt-modal .rhead .dt{font-size:11px;color:#9A9186;margin-top:4px;}
  .receipt-modal .ritems{border-top:1px dashed #D9D3C7;border-bottom:1px dashed #D9D3C7;padding:10px 0;margin:10px 0;}
  .receipt-modal .rline{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;}
  .receipt-modal .rtotals{font-size:12px;}
  .receipt-modal .rtotals .grand{display:flex;justify-content:space-between;font-weight:700;font-size:15px;margin-top:6px;}
  .receipt-modal .rtotals .paid{display:flex;justify-content:space-between;margin-top:8px;color:#9A9186;}
  .receipt-modal .thanks{text-align:center;font-size:11px;color:#B3AB9F;margin-top:16px;}
  .receipt-actions{display:flex;gap:8px;margin-top:18px;font-family:'Work Sans',sans-serif;}
  .receipt-actions .btn{flex:1;justify-content:center;}

  /* Admin */
  .admin-header{background:var(--accent);color:var(--on-accent);padding:16px 20px;display:flex;align-items:center;gap:10px;}
  .admin-back{background:rgba(255,255,255,.18);border:none;color:var(--on-accent);width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .admin-tabs{display:flex;gap:6px;padding:14px 16px 0;}
  .admin-tab{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border-strong);background:transparent;color:var(--sub);}
  .admin-tab.active{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent-dark);}
  .admin-body{padding:16px;}
  .admin-menu-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #F2EFE9;}
  .admin-menu-row:last-child{border-bottom:none;}
  .settings-col{max-width:420px;}
  .pin-col{max-width:320px;}

  @media print{
    body *{visibility:hidden;}
    .receipt-modal, .receipt-modal *{visibility:visible;}
    .receipt-modal{position:absolute;top:0;left:0;width:100%;box-shadow:none;}
    .overlay{position:absolute;background:none;}
    .receipt-actions{display:none;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------- Data ---------------- */

const THEMES = {
  "classic-red": { label:"Classic Red", accent:"#B8272C", accentDark:"#8C1D1F", accentSoft:"#F6E1E1", onAccent:"#FFFFFF", dark:false },
  "emerald": { label:"Emerald", accent:"#1F7A53", accentDark:"#145C3D", accentSoft:"#DFF0E7", onAccent:"#FFFFFF", dark:false },
  "ocean-blue": { label:"Ocean Blue", accent:"#1B5FA8", accentDark:"#124A85", accentSoft:"#DFEBF7", onAccent:"#FFFFFF", dark:false },
  "warm-amber": { label:"Warm Amber", accent:"#C97A0C", accentDark:"#9C5F09", accentSoft:"#F6E6C9", onAccent:"#FFFFFF", dark:false },
  "charcoal-dark": { label:"Charcoal Dark", accent:"#E0A340", accentDark:"#C48A2C", accentSoft:"#3A3121", onAccent:"#211804", dark:true },
};
const PAYMENT_OPTIONS = ["Cash","Card","UPI","Wallet"];
const CATEGORY_SUGGESTIONS = ["Starters","Main Course","Beverages","Desserts","Sides"];
const CURRENCY = "\u20B9";

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function money(n){ return CURRENCY + Number(n||0).toFixed(2); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
async function hashPin(pin){
  const enc = new TextEncoder().encode(pin);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

/* ---------------- Icons (inline SVG) ---------------- */
function icon(name, size){
  size = size || 16;
  const paths = {
    lock:'<rect x="4" y="10" width="16" height="10" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    minus:'<path d="M5 12h14"/>',
    trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
    check:'<path d="M5 12l5 5L20 7"/>',
    x:'<path d="M6 6l12 12M18 6L6 18"/>',
    search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
    printer:'<path d="M6 9V3h12v6M6 18h12v4H6z"/><rect x="4" y="9" width="16" height="7" rx="1"/>',
    chevronLeft:'<path d="M15 6l-6 6 6 6"/>',
    chevronRight:'<path d="M9 6l6 6-6 6"/>',
    pencil:'<path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/>',
    arrowLeft:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
  };
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(paths[name]||"")+'</svg>';
}

/* ---------------- State ---------------- */

let S = {
  config: null,
  menu: [],
  pinHash: null,
  cart: [],
  search: "",
  categoryFilter: "All",
  selectedPayment: null,
  receipt: null,
  adminOpen: false,
  adminTab: "menu",
  pinGateOpen: false,
  pinGateValue: "",
  pinGateError: "",
  wizard: { step:0, name:"", themeId:"classic-red", payments:["Cash"], menuItems:[], error:"" },
};

function loadAll(){
  try{ const c = localStorage.getItem("pos-config"); if(c) S.config = JSON.parse(c); }catch(e){}
  try{ const m = localStorage.getItem("pos-menu"); if(m) S.menu = JSON.parse(m); }catch(e){}
  try{ const p = localStorage.getItem("pos-pin"); if(p) S.pinHash = p; }catch(e){}
}
function saveConfig(cfg){ S.config = cfg; localStorage.setItem("pos-config", JSON.stringify(cfg)); }
function saveMenu(menu){ S.menu = menu; localStorage.setItem("pos-menu", JSON.stringify(menu)); }
function savePin(hash){ S.pinHash = hash; localStorage.setItem("pos-pin", hash); }

function currentTheme(){ return THEMES[(S.config && S.config.themeId) || S.wizard.themeId || "classic-red"]; }
function applyTheme(){
  const t = currentTheme();
  const r = document.documentElement.style;
  r.setProperty("--accent", t.accent);
  r.setProperty("--accent-dark", t.accentDark);
  r.setProperty("--accent-soft", t.accentSoft);
  r.setProperty("--on-accent", t.onAccent);
  r.setProperty("--bg", t.dark ? "#19191A" : "#FAF9F6");
  r.setProperty("--paper", t.dark ? "#232324" : "#FFFFFF");
  r.setProperty("--ink", t.dark ? "#EFEEEC" : "#211D1B");
  r.setProperty("--sub", t.dark ? "#9C9A96" : "#8A8178");
  r.setProperty("--border", t.dark ? "#2A2A2A" : "#EDEAE4");
  r.setProperty("--border-strong", t.dark ? "#3A3A3A" : "#E5E1D9");
}

/* ---------------- Render root ---------------- */

function render(){
  applyTheme();
  const app = document.getElementById("app");
  if(!S.config || !S.config.setupComplete){
    app.innerHTML = renderWizard();
    wireWizard();
    return;
  }
  let html = S.adminOpen ? renderAdmin() : renderBilling();
  if(S.receipt) html += renderReceiptModal();
  if(S.pinGateOpen) html += renderPinGateModal();
  app.innerHTML = html;
  if(S.adminOpen) wireAdmin(); else wireBilling();
  if(S.receipt) wireReceiptModal();
  if(S.pinGateOpen) wirePinGateModal();
}

/* ---------------- Wizard ---------------- */

function renderWizard(){
  const w = S.wizard;
  const steps = ["Restaurant","Theme","Payments","Menu","Admin PIN"];
  let body = "";

  if(w.step===0){
    body = '<h2 class="wizard-title">What\'s your restaurant called?</h2>' +
      '<p class="wizard-sub">This shows on your header and every receipt.</p>' +
      '<input id="wiz-name" class="input" placeholder="e.g. Green Chilli Kitchen" value="'+esc(w.name)+'">';
  }
  if(w.step===1){
    body = '<h2 class="wizard-title">Pick a colour theme</h2>' +
      '<p class="wizard-sub">You can change this later from Admin settings.</p>' +
      '<div class="theme-grid">' + Object.entries(THEMES).map(([id,t])=>
        '<button type="button" class="theme-card'+(w.themeId===id?' selected':'')+'" data-theme="'+id+'" style="'+(w.themeId===id?'border-color:'+t.accent+';':'')+(t.dark?'background:#232324;color:#EFEEEC;':'')+'">'+
          '<div class="theme-swatch" style="background:'+t.accent+'"></div>'+
          '<div style="font-size:13px;font-weight:600;">'+t.label+'</div>'+
        '</button>').join('') + '</div>';
  }
  if(w.step===2){
    body = '<h2 class="wizard-title">How do you accept payment?</h2>' +
      '<p class="wizard-sub">Select all that apply — these appear at checkout.</p>' +
      '<div class="pay-grid">' + PAYMENT_OPTIONS.map(p=>{
        const on = w.payments.includes(p);
        return '<button type="button" class="pay-card'+(on?' selected':'')+'" data-pay="'+p+'">'+p+(on?' <span style="margin-left:auto">'+icon('check',16)+'</span>':'')+'</button>';
      }).join('') + '</div>';
  }
  if(w.step===3){
    body = '<h2 class="wizard-title">Add your menu</h2>' +
      '<p class="wizard-sub">Add a few items now — you can add more anytime from Admin.</p>' +
      '<div class="item-add-grid">' +
        '<input id="wiz-item-name" class="input" placeholder="Item name">' +
        '<input id="wiz-item-category" class="input" list="cats" placeholder="Category">' +
        '<datalist id="cats">'+CATEGORY_SUGGESTIONS.map(c=>'<option value="'+c+'">').join('')+'</datalist>' +
        '<input id="wiz-item-price" class="input" inputmode="decimal" placeholder="Price">' +
        '<button type="button" id="wiz-add-item" class="btn btn-primary" style="padding:0 14px;">'+icon('plus',18)+'</button>' +
      '</div>' +
      '<div class="item-list">' + (w.menuItems.length===0 ? '<p style="padding:14px;color:#B3AB9F;font-size:13px;margin:0;">No items added yet.</p>' :
        w.menuItems.map(it=>
          '<div class="row between">'+
            '<div><div style="font-size:14px;font-weight:500;">'+esc(it.name)+'</div><div style="font-size:12px;color:var(--sub);">'+esc(it.category)+'</div></div>'+
            '<div class="row" style="gap:10px;"><span class="mono" style="font-size:13px;">'+money(it.price)+'</span><button type="button" class="btn-icon" data-remove-item="'+it.id+'">'+icon('trash',15)+'</button></div>'+
          '</div>').join('')
      ) + '</div>';
  }
  if(w.step===4){
    body = '<h2 class="wizard-title">Set an admin PIN</h2>' +
      '<p class="wizard-sub">You\'ll need this to edit the menu or prices later. 4-6 digits.</p>' +
      '<input id="wiz-pin1" class="input" type="password" inputmode="numeric" maxlength="6" placeholder="Enter PIN" style="margin-bottom:10px;">' +
      '<input id="wiz-pin2" class="input" type="password" inputmode="numeric" maxlength="6" placeholder="Confirm PIN">';
  }

  return '<div class="wizard">' +
    '<div class="wizard-progress">' + steps.map((s,i)=>'<div class="'+(i<=w.step?'active':'')+'"></div>').join('') + '</div>' +
    '<p class="wizard-step-label">Step '+(w.step+1)+' of '+steps.length+' — '+steps[w.step]+'</p>' +
    body +
    (w.error ? '<p class="error">'+esc(w.error)+'</p>' : '') +
    '<div class="wizard-nav">' +
      '<button type="button" id="wiz-back" class="btn btn-secondary" style="opacity:'+(w.step===0?'.4':'1')+'">'+icon('chevronLeft',16)+' Back</button>' +
      '<button type="button" id="wiz-next" class="btn btn-primary">'+(w.step===steps.length-1?'Finish setup':'Continue')+' '+icon('chevronRight',16)+'</button>' +
    '</div>' +
  '</div>';
}

function wireWizard(){
  const w = S.wizard;
  document.querySelectorAll('[data-theme]').forEach(el=>{
    el.addEventListener('click', ()=>{ w.themeId = el.getAttribute('data-theme'); render(); });
  });
  document.querySelectorAll('[data-pay]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const p = el.getAttribute('data-pay');
      if(w.payments.includes(p)) w.payments = w.payments.filter(x=>x!==p); else w.payments.push(p);
      render();
    });
  });
  const addBtn = document.getElementById('wiz-add-item');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    const name = document.getElementById('wiz-item-name').value.trim();
    const category = document.getElementById('wiz-item-category').value.trim() || "General";
    const price = document.getElementById('wiz-item-price').value;
    if(!name || !price || isNaN(Number(price))){ w.error = "Enter an item name and a valid price."; render(); return; }
    w.menuItems.push({ id: uid(), name, category, price: Number(price) });
    w.error = "";
    render();
  });
  document.querySelectorAll('[data-remove-item]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-remove-item');
      w.menuItems = w.menuItems.filter(i=>i.id!==id);
      render();
    });
  });
  const backBtn = document.getElementById('wiz-back');
  if(backBtn) backBtn.addEventListener('click', ()=>{ w.error=""; w.step = Math.max(0, w.step-1); render(); });
  const nextBtn = document.getElementById('wiz-next');
  if(nextBtn) nextBtn.addEventListener('click', async ()=>{
    w.error = "";
    if(w.step===0){
      const val = document.getElementById('wiz-name').value.trim();
      if(!val){ w.error="Enter your restaurant's name."; render(); return; }
      w.name = val;
    }
    if(w.step===2 && w.payments.length===0){ w.error="Select at least one payment option."; render(); return; }
    if(w.step===4){
      const pin1 = document.getElementById('wiz-pin1').value;
      const pin2 = document.getElementById('wiz-pin2').value;
      if(!/^\d{4,6}$/.test(pin1)){ w.error="PIN must be 4-6 digits."; render(); return; }
      if(pin1!==pin2){ w.error="PINs don't match."; render(); return; }
      const cfg = { name:w.name, themeId:w.themeId, payments:w.payments, setupComplete:true };
      saveConfig(cfg);
      saveMenu(w.menuItems);
      const h = await hashPin(pin1);
      savePin(h);
      render();
      return;
    }
    w.step += 1;
    render();
  });
}

/* ---------------- Billing screen ---------------- */

function getCategories(){ return ["All", ...Array.from(new Set(S.menu.map(m=>m.category)))]; }
function filteredMenu(){
  return S.menu.filter(m=>{
    const matchCat = S.categoryFilter==="All" || m.category===S.categoryFilter;
    const matchSearch = m.name.toLowerCase().includes(S.search.toLowerCase());
    return matchCat && matchSearch;
  });
}
function cartLines(){
  return S.cart.map(c=>{
    const item = S.menu.find(m=>m.id===c.id);
    return item ? Object.assign({}, item, {qty:c.qty}) : null;
  }).filter(Boolean);
}

function renderBilling(){
  const cats = getCategories();
  return '<div class="app-header">' +
      '<div><h1>'+esc(S.config.name)+'</h1><p>'+new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'})+'</p></div>' +
      '<button type="button" class="header-lock" id="open-admin" aria-label="Admin">'+icon('lock',17)+'</button>' +
    '</div>' +
    '<div class="pos-layout">' +
      '<div class="menu-col">' +
        '<div class="search-wrap">'+icon('search',15)+'<input id="bill-search" class="input" placeholder="Search menu" value="'+esc(S.search)+'"></div>' +
        '<div class="chips">' + cats.map(c=>'<button type="button" class="chip'+(S.categoryFilter===c?' active':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>').join('') + '</div>' +
        '<div class="menu-grid" id="menu-grid">' + menuGridHtml() + '</div>' +
      '</div>' +
      '<div class="cart-col" id="cart-col">' + cartColHtml() + '</div>' +
    '</div>';
}

function menuGridHtml(){
  const items = filteredMenu();
  if(items.length===0) return '<p class="empty-msg">No items match. Add items from Admin.</p>';
  return items.map(item=>
    '<button type="button" class="menu-card" data-add="'+item.id+'">' +
      '<div class="cat">'+esc(item.category)+'</div>' +
      '<div class="nm">'+esc(item.name)+'</div>' +
      '<div class="pr-row"><span class="price">'+money(item.price)+'</span><span class="plus">'+icon('plus',14)+'</span></div>' +
    '</button>'
  ).join('');
}

function cartColHtml(){
  const lines = cartLines();
  const subtotal = lines.reduce((s,l)=>s+l.price*l.qty,0);
  const total = subtotal;
  let html = '<div class="receipt-box">' +
    '<div class="title">CURRENT BILL</div>' +
    (lines.length===0 ? '<p style="color:var(--sub);font-size:13px;text-align:center;font-family:\'Work Sans\',sans-serif;">Tap a menu item to add it here.</p>' :
      lines.map(l=>
        '<div class="cart-line">' +
          '<div class="nm">'+esc(l.name)+'</div>' +
          '<button type="button" class="btn-icon" data-qty-down="'+l.id+'" style="width:20px;height:20px;">'+icon('minus',12)+'</button>' +
          '<span class="qty">'+l.qty+'</span>' +
          '<button type="button" class="btn-icon" data-qty-up="'+l.id+'" style="width:20px;height:20px;">'+icon('plus',12)+'</button>' +
          '<span class="amt">'+money(l.price*l.qty)+'</span>' +
          '<button type="button" class="btn-icon" data-remove-line="'+l.id+'" style="width:20px;height:20px;color:#B8272C;">'+icon('x',13)+'</button>' +
        '</div>'
      ).join('')
    ) +
    (lines.length>0 ? '<div class="cart-totals"><div class="row between" style="color:var(--sub);"><span>Subtotal</span><span>'+money(subtotal)+'</span></div><div class="grand"><span>Total</span><span>'+money(total)+'</span></div></div>' : '') +
  '</div>';

  if(lines.length>0){
    html += '<div class="pay-row">' + S.config.payments.map(p=>{
      const on = S.selectedPayment===p;
      return '<button type="button" class="pay-chip'+(on?' selected':'')+'" data-select-pay="'+p+'">'+esc(p)+'</button>';
    }).join('') + '</div>';
    html += '<button type="button" class="btn btn-primary complete-btn" id="complete-sale" '+(S.selectedPayment?'':'disabled')+'>Complete sale — '+money(total)+'</button>';
  }
  return html;
}

function refreshMenuGrid(){ document.getElementById('menu-grid').innerHTML = menuGridHtml(); wireMenuGrid(); }
function refreshCartCol(){ document.getElementById('cart-col').innerHTML = cartColHtml(); wireCartCol(); }

function wireMenuGrid(){
  document.querySelectorAll('[data-add]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-add');
      const existing = S.cart.find(c=>c.id===id);
      if(existing) existing.qty += 1; else S.cart.push({id, qty:1});
      refreshCartCol();
    });
  });
}
function wireCartCol(){
  document.querySelectorAll('[data-qty-up]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.getAttribute('data-qty-up');
    const c = S.cart.find(x=>x.id===id); if(c) c.qty += 1;
    refreshCartCol();
  }));
  document.querySelectorAll('[data-qty-down]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.getAttribute('data-qty-down');
    const c = S.cart.find(x=>x.id===id); if(c) c.qty -= 1;
    S.cart = S.cart.filter(x=>x.qty>0);
    refreshCartCol();
  }));
  document.querySelectorAll('[data-remove-line]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.getAttribute('data-remove-line');
    S.cart = S.cart.filter(x=>x.id!==id);
    refreshCartCol();
  }));
  document.querySelectorAll('[data-select-pay]').forEach(el=>el.addEventListener('click', ()=>{
    S.selectedPayment = el.getAttribute('data-select-pay');
    refreshCartCol();
  }));
  const completeBtn = document.getElementById('complete-sale');
  if(completeBtn) completeBtn.addEventListener('click', ()=>{
    const lines = cartLines();
    if(lines.length===0 || !S.selectedPayment) return;
    const subtotal = lines.reduce((s,l)=>s+l.price*l.qty,0);
    S.receipt = { items:lines, subtotal, total:subtotal, payment:S.selectedPayment, timestamp:new Date() };
    S.cart = [];
    S.selectedPayment = null;
    render();
  });
}

function wireBilling(){
  const openAdmin = document.getElementById('open-admin');
  if(openAdmin) openAdmin.addEventListener('click', ()=>{
    S.pinGateValue=""; S.pinGateError=""; S.pinGateOpen = true; render();
  });
  const searchInput = document.getElementById('bill-search');
  if(searchInput) searchInput.addEventListener('input', (e)=>{
    S.search = e.target.value;
    refreshMenuGrid();
  });
  document.querySelectorAll('[data-cat]').forEach(el=>{
    el.addEventListener('click', ()=>{ S.categoryFilter = el.getAttribute('data-cat'); render(); });
  });
  wireMenuGrid();
  wireCartCol();
}

/* ---------------- Receipt modal ---------------- */

function renderReceiptModal(){
  const r = S.receipt;
  return '<div class="overlay" id="receipt-overlay"><div class="modal receipt-modal">' +
    '<div class="rhead"><div class="nm">'+esc(S.config.name)+'</div><div class="dt">'+r.timestamp.toLocaleString()+'</div></div>' +
    '<div class="ritems">' + r.items.map(l=>'<div class="rline"><span>'+l.qty+' x '+esc(l.name)+'</span><span>'+money(l.price*l.qty)+'</span></div>').join('') + '</div>' +
    '<div class="rtotals">' +
      '<div class="row between"><span>Subtotal</span><span>'+money(r.subtotal)+'</span></div>' +
      '<div class="grand"><span>Total</span><span>'+money(r.total)+'</span></div>' +
      '<div class="paid"><span>Paid via</span><span>'+esc(r.payment)+'</span></div>' +
    '</div>' +
    '<div class="thanks">Thank you!</div>' +
    '<div class="receipt-actions">' +
      '<button type="button" class="btn btn-secondary" id="print-receipt">'+icon('printer',15)+' Print</button>' +
      '<button type="button" class="btn btn-primary" id="close-receipt">New bill</button>' +
    '</div>' +
  '</div></div>';
}
function wireReceiptModal(){
  document.getElementById('print-receipt').addEventListener('click', ()=>window.print());
  document.getElementById('close-receipt').addEventListener('click', ()=>{ S.receipt = null; render(); });
}

/* ---------------- PIN gate modal ---------------- */

function renderPinGateModal(){
  return '<div class="overlay"><div class="modal">' +
    '<div class="row" style="gap:8px;margin-bottom:14px;">'+icon('lock',16)+'<h3 style="font-size:15px;">Enter admin PIN</h3></div>' +
    '<input id="pin-gate-input" class="input" type="password" inputmode="numeric" maxlength="6" style="text-align:center;letter-spacing:4px;font-size:18px;" value="'+esc(S.pinGateValue)+'">' +
    (S.pinGateError ? '<p class="error">'+esc(S.pinGateError)+'</p>' : '') +
    '<div class="row" style="gap:8px;margin-top:16px;"><button type="button" class="btn btn-secondary" id="pin-gate-cancel" style="flex:1;justify-content:center;">Cancel</button><button type="button" class="btn btn-primary" id="pin-gate-submit" style="flex:1;justify-content:center;">Unlock</button></div>' +
  '</div></div>';
}
function wirePinGateModal(){
  const inp = document.getElementById('pin-gate-input');
  inp.focus();
  inp.addEventListener('input', e=>{ S.pinGateValue = e.target.value.replace(/\D/g,''); e.target.value = S.pinGateValue; });
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submitPinGate(); });
  document.getElementById('pin-gate-cancel').addEventListener('click', ()=>{ S.pinGateOpen=false; render(); });
  document.getElementById('pin-gate-submit').addEventListener('click', submitPinGate);
}
async function submitPinGate(){
  const h = await hashPin(S.pinGateValue);
  if(h===S.pinHash){ S.pinGateOpen=false; S.adminOpen=true; S.adminTab="menu"; render(); }
  else { S.pinGateError="Incorrect PIN. Try again."; render(); }
}

/* ---------------- Admin panel ---------------- */

let adminEditingId = null;

function renderAdmin(){
  return '<div class="admin-header">' +
      '<button type="button" class="admin-back" id="admin-close">'+icon('arrowLeft',16)+'</button>' +
      '<h1 style="font-size:19px;">Admin</h1>' +
    '</div>' +
    '<div class="admin-tabs">' +
      ['menu','settings','pin'].map(t=>{
        const label = t==='menu'?'Menu':t==='settings'?'Settings':'Change PIN';
        return '<button type="button" class="admin-tab'+(S.adminTab===t?' active':'')+'" data-tab="'+t+'">'+label+'</button>';
      }).join('') +
    '</div>' +
    '<div class="admin-body" id="admin-body">' + adminBodyHtml() + '</div>';
}

function adminBodyHtml(){
  if(S.adminTab==='menu') return adminMenuHtml();
  if(S.adminTab==='settings') return adminSettingsHtml();
  return adminPinHtml();
}

function adminMenuHtml(){
  let rows = S.menu.length===0 ? '<p style="padding:14px;color:var(--sub);font-size:13px;margin:0;">No menu items yet.</p>' :
    S.menu.map(it=>{
      if(adminEditingId===it.id){
        return '<div class="admin-menu-row">' +
          '<input class="input" id="edit-name-'+it.id+'" value="'+esc(it.name)+'" style="flex:2;">' +
          '<input class="input" id="edit-cat-'+it.id+'" value="'+esc(it.category)+'" style="flex:1.3;">' +
          '<input class="input" id="edit-price-'+it.id+'" value="'+it.price+'" style="flex:1;">' +
          '<button type="button" class="btn-icon" data-save-edit="'+it.id+'">'+icon('check',15)+'</button>' +
        '</div>';
      }
      return '<div class="admin-menu-row">' +
        '<div style="flex:1;"><div style="font-size:14px;font-weight:500;">'+esc(it.name)+'</div><div style="font-size:12px;color:var(--sub);">'+esc(it.category)+'</div></div>' +
        '<span class="mono" style="font-size:13px;">'+money(it.price)+'</span>' +
        '<button type="button" class="btn-icon" data-start-edit="'+it.id+'">'+icon('pencil',14)+'</button>' +
        '<button type="button" class="btn-icon" data-delete-item="'+it.id+'">'+icon('trash',14)+'</button>' +
      '</div>';
    }).join('');
  return '<div class="item-add-grid">' +
      '<input id="admin-item-name" class="input" placeholder="Item name">' +
      '<input id="admin-item-category" class="input" list="cats2" placeholder="Category">' +
      '<datalist id="cats2">'+CATEGORY_SUGGESTIONS.map(c=>'<option value="'+c+'">').join('')+'</datalist>' +
      '<input id="admin-item-price" class="input" inputmode="decimal" placeholder="Price">' +
      '<button type="button" class="btn btn-primary" id="admin-add-item" style="padding:0 14px;">'+icon('plus',18)+'</button>' +
    '</div>' +
    '<div class="item-list">' + rows + '</div>';
}

function adminSettingsHtml(){
  const c = S.config;
  return '<div class="settings-col">' +
    '<label class="label">Restaurant name</label>' +
    '<input id="admin-name" class="input" value="'+esc(c.name)+'" style="margin-bottom:14px;">' +
    '<label class="label">Colour theme</label>' +
    '<div class="theme-grid" style="margin-bottom:14px;">' + Object.entries(THEMES).map(([id,t])=>
      '<button type="button" class="theme-card" data-admin-theme="'+id+'" style="display:flex;align-items:center;gap:8px;padding:10px;'+(c.themeId===id?'border-color:'+t.accent+';border-width:2px;':'')+'">'+
        '<div class="theme-swatch" style="width:16px;height:16px;margin:0;background:'+t.accent+'"></div><span style="font-size:13px;">'+t.label+'</span>'+
      '</button>').join('') + '</div>' +
    '<label class="label">Payment options</label>' +
    '<div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:14px;">' + PAYMENT_OPTIONS.map(p=>{
      const on = c.payments.includes(p);
      return '<button type="button" class="chip'+(on?' active':'')+'" data-admin-pay="'+p+'">'+p+'</button>';
    }).join('') + '</div>' +
    '<button type="button" class="btn btn-primary" id="admin-save-settings">Save settings</button>' +
    '<span id="admin-settings-msg" class="success" style="margin-left:10px;"></span>' +
  '</div>';
}

function adminPinHtml(){
  return '<div class="pin-col">' +
    '<label class="label">Current PIN</label>' +
    '<input id="admin-old-pin" class="input" type="password" inputmode="numeric" maxlength="6" style="margin-bottom:12px;">' +
    '<label class="label">New PIN</label>' +
    '<input id="admin-new-pin" class="input" type="password" inputmode="numeric" maxlength="6" style="margin-bottom:12px;">' +
    '<label class="label">Confirm new PIN</label>' +
    '<input id="admin-confirm-pin" class="input" type="password" inputmode="numeric" maxlength="6" style="margin-bottom:14px;">' +
    '<p id="admin-pin-msg" class="error" style="display:none;"></p>' +
    '<button type="button" class="btn btn-primary" id="admin-update-pin">Update PIN</button>' +
  '</div>';
}

function refreshAdminBody(){ document.getElementById('admin-body').innerHTML = adminBodyHtml(); wireAdminBody(); }

function wireAdmin(){
  document.getElementById('admin-close').addEventListener('click', ()=>{ S.adminOpen=false; render(); });
  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.addEventListener('click', ()=>{ S.adminTab = el.getAttribute('data-tab'); adminEditingId=null; render(); });
  });
  wireAdminBody();
}

function wireAdminBody(){
  if(S.adminTab==='menu'){
    const addBtn = document.getElementById('admin-add-item');
    if(addBtn) addBtn.addEventListener('click', ()=>{
      const name = document.getElementById('admin-item-name').value.trim();
      const category = document.getElementById('admin-item-category').value.trim() || "General";
      const price = document.getElementById('admin-item-price').value;
      if(!name || !price || isNaN(Number(price))) return;
      const next = S.menu.concat([{id:uid(), name, category, price:Number(price)}]);
      saveMenu(next);
      refreshAdminBody();
    });
    document.querySelectorAll('[data-start-edit]').forEach(el=>el.addEventListener('click', ()=>{
      adminEditingId = el.getAttribute('data-start-edit');
      refreshAdminBody();
    }));
    document.querySelectorAll('[data-save-edit]').forEach(el=>el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-save-edit');
      const name = document.getElementById('edit-name-'+id).value;
      const category = document.getElementById('edit-cat-'+id).value;
      const price = Number(document.getElementById('edit-price-'+id).value) || 0;
      const next = S.menu.map(i=> i.id===id ? Object.assign({}, i, {name, category, price}) : i);
      saveMenu(next);
      adminEditingId = null;
      refreshAdminBody();
    }));
    document.querySelectorAll('[data-delete-item]').forEach(el=>el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-delete-item');
      saveMenu(S.menu.filter(i=>i.id!==id));
      refreshAdminBody();
    }));
  }
  if(S.adminTab==='settings'){
    let pendingTheme = S.config.themeId;
    let pendingPayments = S.config.payments.slice();
    document.querySelectorAll('[data-admin-theme]').forEach(el=>el.addEventListener('click', ()=>{
      pendingTheme = el.getAttribute('data-admin-theme');
      saveConfig(Object.assign({}, S.config, {themeId: pendingTheme}));
      applyTheme();
      refreshAdminBody();
    }));
    document.querySelectorAll('[data-admin-pay]').forEach(el=>el.addEventListener('click', ()=>{
      const p = el.getAttribute('data-admin-pay');
      pendingPayments = S.config.payments.includes(p) ? S.config.payments.filter(x=>x!==p) : S.config.payments.concat([p]);
      saveConfig(Object.assign({}, S.config, {payments: pendingPayments}));
      refreshAdminBody();
    }));
    document.getElementById('admin-save-settings').addEventListener('click', ()=>{
      const name = document.getElementById('admin-name').value.trim() || S.config.name;
      saveConfig(Object.assign({}, S.config, {name}));
      const msg = document.getElementById('admin-settings-msg');
      msg.textContent = "Settings saved.";
      setTimeout(()=>{ msg.textContent=""; }, 2000);
    });
  }
  if(S.adminTab==='pin'){
    document.getElementById('admin-update-pin').addEventListener('click', async ()=>{
      const oldPin = document.getElementById('admin-old-pin').value;
      const newPin = document.getElementById('admin-new-pin').value;
      const confirmPin = document.getElementById('admin-confirm-pin').value;
      const msg = document.getElementById('admin-pin-msg');
      msg.style.display = 'block';
      if(!/^\d{4,6}$/.test(newPin)){ msg.textContent = "New PIN must be 4-6 digits."; return; }
      if(newPin!==confirmPin){ msg.textContent = "New PINs don't match."; return; }
      const oldHash = await hashPin(oldPin);
      if(oldHash !== S.pinHash){ msg.textContent = "Current PIN is incorrect."; return; }
      const newHash = await hashPin(newPin);
      savePin(newHash);
      msg.style.display = 'none';
      document.getElementById('admin-old-pin').value='';
      document.getElementById('admin-new-pin').value='';
      document.getElementById('admin-confirm-pin').value='';
      const successMsg = document.createElement('p');
      successMsg.className = 'success';
      successMsg.textContent = 'PIN updated.';
      msg.parentNode.insertBefore(successMsg, msg);
      setTimeout(()=>successMsg.remove(), 2000);
    });
  }
}

/* ---------------- Init ---------------- */

loadAll();
render();
</script>
